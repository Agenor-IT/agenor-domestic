name: CI - Agenor Domestic

on:
  workflow_dispatch:
    inputs:
      gate:
        description: "Control pendiente; types reutiliza las pruebas ya verdes del release"
        type: choice
        options:
          - voice
          - types
        default: voice
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Verificación de Calidad y Pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias congeladas (package-lock.json)
        run: npm ci

      - name: Ejecutar pruebas automatizadas (Vitest)
        if: github.event_name != 'workflow_dispatch' || inputs.gate != 'types'
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            npm run test -- src/application/voice/VoiceCommandController.test.ts src/application/voice/voiceToken.test.ts
          else
            npm run test
          fi

      - name: Validar captura de audio de Domestic
        if: github.event_name != 'workflow_dispatch' || inputs.gate != 'types'
        run: node scripts/test-domestic-voice-worklet.mjs

      # deploy-hostinger.yml es el único productor del artefacto publicable.
      - name: Verificar tipos de TypeScript
        run: npx --no-install tsc --noEmit
