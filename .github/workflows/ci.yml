name: CI - Agenor Domestic

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Verificación de Calidad y Pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias congeladas (package-lock.json)
        run: npm ci

      - name: Ejecutar pruebas automatizadas (Vitest)
        run: npm run test

      - name: Compilación de producción (Vite + TypeScript)
        run: npm run build
